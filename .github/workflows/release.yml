# Builds ssHattrick for the Asciiverse catalog and as system packages.
#
# For av: one archive per target, named <id>-<target>.tar.gz (Linux, macOS)
# or .zip (Windows), plus a SHA256SUMS file, attached to a GitHub release
# (hub/catalog/SCHEMA.md, release.source = "github").
# For everyone else: .deb, .rpm, .apk and Arch packages from the same static
# Linux binary, made by nfpm (asciiverse/nfpm.yaml).
#
# Tags look like v0.2.1-av.1: upstream's version, then our packaging release.
# Linux builds run in Alpine, so the binaries are static (musl). Windows
# builds use MSVC on Windows runners. russh's cryptography (aws-lc-rs)
# compiles C: Alpine needs a C toolchain and CMake, and Windows gets NASM.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: sshattrick
  BIN: sshattrick
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, arch: amd64, cflags: "" }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, arch: arm64, cflags: "" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          docker run --rm -v "$PWD":/src -w /src -e CFLAGS="${{ matrix.cflags }}" rust:1-alpine sh -c '
            apk add --no-cache musl-dev pkgconf perl make cmake clang linux-headers &&
            cargo build --release --locked'
          sudo chown -R "$(id -u):$(id -g)" target
          file target/release/$BIN

      - name: Package for av
        run: |
          # the binary sits at the top of the archive, where av looks for it
          mkdir -p stage dist
          cp target/release/$BIN LICENSE README.md stage/ && cp crates/sshattrick-core/LICENSE-MIT stage/LICENSE-CORE-MIT
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - name: System packages
        run: |
          v="${TAG#v}"; export VERSION="${v%%-av.*}" RELEASE="${v##*-av.}" ARCH="${{ matrix.arch }}"
          for p in deb rpm apk archlinux; do
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
              -e VERSION -e RELEASE -e ARCH goreleaser/nfpm:v2.43.0 \
              package --config asciiverse/nfpm.yaml --packager "$p" --target dist/
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}
          strip target/${{ matrix.target }}/release/$BIN
          file target/${{ matrix.target }}/release/$BIN

      - name: Package
        run: |
          mkdir -p stage dist
          cp target/${{ matrix.target }}/release/$BIN LICENSE README.md stage/ && cp crates/sshattrick-core/LICENSE-MIT stage/LICENSE-CORE-MIT
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  windows:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: ilammy/setup-nasm@v1

      - name: Build
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p stage dist
          cp target/${{ matrix.target }}/release/$BIN.exe LICENSE README.md stage/ && cp crates/sshattrick-core/LICENSE-MIT stage/LICENSE-CORE-MIT
          (cd stage && 7z a -tzip "../dist/$ID-${{ matrix.target }}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "ssHattrick $TAG" \
                 --notes "ssHattrick ${TAG%%-av.*} from github.com/ricott1/sshattrick, built for the Asciiverse catalog: plays here against the computer or a friend on your network, or serves over ssh. With .deb, .rpm, .apk and Arch packages. Changes from upstream: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
